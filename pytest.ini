[pytest]
minversion = 7.0
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    -n auto
testpaths = 
    tests
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
    *Test
python_functions = 
    test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gpu: marks tests that require GPU
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
asyncio_mode = auto